services:
  - type: web
    name: puntocom-api-demo
    runtime: python
    plan: free
    region: virginia
    buildCommand: pip install -r requirements-produccion.txt
    startCommand: python -m backend.preparar_nube && gunicorn --config gunicorn.conf.py backend.wsgi:app
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: DEMO_CAJERO_PASSWORD
        sync: false
      - key: DEMO_BODEGA_PASSWORD
        sync: false
